- name: Conditions in ansible
  hosts: localhost
  vars_prompt:
    - name: number
      prompt: "Please enter a number="
      private: false
  tasks:
  - name: Printing numbers less than 10
    ansible.builtin.debug:
      msg: "{{ number }} is less than 10.😁"
    when: number | int <10
  - name: Printing numbers greater than or equal to 10
    ansible.builtin.debug:
      msg: "{{ number }} is greater than or equal to 10.🤪"
    when: number | int >= 10

